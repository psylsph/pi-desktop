<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>Pi Desktop</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ─── Sidebar ──────────────────────────────────────────── -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 12h8M12 8v8"/>
          </svg>
          <h1>Pi</h1>
        </div>
      </div>

      <div class="sidebar-actions">
        <button id="btn-new-session" class="sidebar-btn" title="New session">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>New Session</span>
        </button>
        <button id="btn-open-dir" class="sidebar-btn" title="Change working directory">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span>Open Project</span>
        </button>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label" for="model-select">Model</label>
        <select id="model-select" class="model-select">
          <option value="">Loading models…</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label class="sidebar-label">Thinking Level</label>
        <div class="thinking-levels" id="thinking-levels">
          <button class="level-btn" data-level="off">Off</button>
          <button class="level-btn" data-level="low">Low</button>
          <button class="level-btn" data-level="medium">Med</button>
          <button class="level-btn" data-level="high">High</button>
        </div>
      </div>

      <div class="sidebar-section">
        <button id="btn-compact" class="sidebar-btn compact-btn" title="Compact context">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><polyline points="12 12 12 21"/><polyline points="8 17 12 21 16 17"/></svg>
          <span>Compact</span>
        </button>
      </div>

      <div class="sidebar-footer">
        <div id="model-info" class="model-info">No model</div>
        <div id="session-info" class="session-info">No session</div>
      </div>
    </aside>

    <!-- ─── Main content ─────────────────────────────────────── -->
    <main id="main-content">
      <!-- Header bar -->
      <header id="header">
        <div class="header-left">
          <button id="btn-sidebar-toggle" class="icon-btn" title="Toggle sidebar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <span id="working-dir" class="working-dir">~</span>
        </div>
        <div id="status-bar" class="status-bar">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Initializing…</span>
        </div>
      </header>

      <!-- Messages area -->
      <div id="messages" class="messages">
        <div class="welcome-message">
          <div class="welcome-icon">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/>
              <path d="M8 12h8M12 8v8"/>
            </svg>
          </div>
          <h2>Welcome to Pi Desktop</h2>
          <p>Your cross-platform coding agent. Type a message below to get started.</p>
          <p class="hint">Use <kbd>Shift+Enter</kbd> for new lines, <kbd>Enter</kbd> to send, <kbd>Escape</kbd> to abort.</p>
        </div>
      </div>

      <!-- Input area -->
      <div id="input-area" class="input-area">
        <div class="input-wrapper">
          <textarea
            id="prompt-input"
            placeholder="Ask Pi anything…"
            rows="1"
            autofocus
          ></textarea>
          <div class="input-actions">
            <button id="btn-abort" class="icon-btn abort-btn" title="Abort (Escape)" style="display:none;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            </button>
            <button id="btn-send" class="icon-btn send-btn" title="Send (Enter)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Toast notifications -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
